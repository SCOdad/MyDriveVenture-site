name: Family Profile UAT

on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/js/family*.js'
      - 'family/**'
      - 'tests/family-avatar-recovery.test.js'
      - 'tests/e2e/family-avatar-uat.spec.mjs'
      - '.github/workflows/family-profile-uat.yml'

permissions:
  contents: read

jobs:
  family-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: node --test tests/family-avatar-recovery.test.js tests/uat-family-profile-stabilization.test.js tests/bklg-0248-family-driver-regression.test.js tests/bklg-0250-license-holder-family-model.test.js tests/bklg-0240-unified-family-profile.test.js
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e/family-avatar-uat.spec.mjs --retries=0
