name: BKLG-0206 Receipt Checkout UI
on:
  pull_request:
    paths:
      - 'assets/js/commercial-purchase.js'
      - 'assets/css/commercial-purchase.css'
      - 'tests/bklg-0206-receipt-ui.test.js'
      - '.github/workflows/bklg-0206-receipt-ui.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  receipt-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check assets/js/commercial-purchase.js
      - run: node --test tests/bklg-0206-receipt-ui.test.js tests/bklg-0208-checkout.test.js
