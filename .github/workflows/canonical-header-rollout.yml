name: Canonical Header Rollout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/canonical-header-rollout.yml'

permissions:
  contents: write

jobs:
  rollout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply canonical header bootstrap
        run: |
          python - <<'PY'
          from pathlib import Path

          excluded_roots = {'staging', 'operator', 'backlog'}
          script = '<script src="/assets/js/canonical-header.js?v=20260822-0315"></script>'
          changed = []

          for path in Path('.').rglob('*.html'):
              parts = path.parts
              if path.name == '404.html' or any(p in excluded_roots for p in parts[:-1]):
                  continue
              text = path.read_text(encoding='utf-8')
              if 'class="site-header"' not in text:
                  continue
              # Join, Waitlist, and Feedback inherit the canonical header from submission-context.js.
              if '/assets/js/submission-context.js' in text:
                  continue
              if '/assets/js/canonical-header.js' in text:
                  continue
              if '</body>' not in text:
                  continue
              text = text.replace('</body>', script + '</body>', 1)
              path.write_text(text, encoding='utf-8')
              changed.append(str(path))

          print('Updated:')
          for p in changed:
              print(' -', p)
          PY
      - name: Remove one-time workflow
        run: git rm .github/workflows/canonical-header-rollout.yml
      - name: Commit rollout
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Deploy canonical header site-wide [skip ci]'
          git push
