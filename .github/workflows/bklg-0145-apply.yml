name: BKLG-0145 Apply National Pilot Messaging

on:
  push:
    branches:
      - bklg-0145-national-pilot-messaging
    paths:
      - tools/apply-bklg-0145.py

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bklg-0145-national-pilot-messaging
      - name: Apply BKLG-0145 changes
        run: python3 tools/apply-bklg-0145.py
      - name: Validate expected messaging
        run: |
          grep -q 'Join the pilot' index.html
          grep -q 'Michigan and Kansas' index.html
          ! grep -q 'Join the Michigan pilot' index.html
          grep -q 'Michigan and Kansas are bright yellow' assets/images/state-requirements-map.svg
      - name: Commit generated changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html assets/images/state-requirements-map.svg tools/build-state-requirements-map.py
          git diff --cached --quiet && exit 0
          git commit -m 'BKLG-0145 update national pilot messaging and map'
          git push origin HEAD:bklg-0145-national-pilot-messaging
