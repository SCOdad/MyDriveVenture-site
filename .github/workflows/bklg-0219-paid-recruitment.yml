name: BKLG-0219 Paid Recruitment

on:
  pull_request:
    branches: [main]
    paths:
      - 'join/recruit/**'
      - 'assets/css/recruit.css'
      - 'assets/js/join-v2.js'
      - 'tests/bklg-0197-onboarding-v2.test.js'
      - 'tests/bklg-0219-paid-recruitment.test.js'
      - 'tests/e2e/bklg-0219-paid-recruitment.spec.mjs'
      - '.github/workflows/bklg-0219-paid-recruitment.yml'
  push:
    branches: [main]
    paths:
      - 'join/recruit/**'
      - 'assets/css/recruit.css'
      - 'assets/js/join-v2.js'
      - '.github/workflows/bklg-0219-paid-recruitment.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Paid recruitment contract
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - name: Verify acquisition and landing contracts
        run: node --test tests/bklg-0197-onboarding-v2.test.js tests/bklg-0219-paid-recruitment.test.js
      - name: Verify JavaScript syntax
        run: npm run test:js

  browser:
    name: Paid recruitment Playwright
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DV_E2E_BASE_URL: http://127.0.0.1:4173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Serve checked-out frontend
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/dv-bklg-0219-http.log 2>&1 &
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/join/recruit/ >/dev/null; then
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/dv-bklg-0219-http.log
          exit 1
      - name: Run paid recruitment browser checks
        run: npx playwright test tests/e2e/bklg-0219-paid-recruitment.spec.mjs --retries=0
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bklg-0219-playwright-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 3
          compression-level: 9

  production-readonly:
    name: Production route and performance
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for production deployment
        shell: bash
        run: |
          for attempt in {1..30}; do
            body="$(curl --fail --silent --show-error --max-time 20 https://mydriveventure.com/join/recruit/ || true)"
            if printf '%s' "$body" | grep -q 'Make the practice hours feel like progress.'; then
              printf '%s' "$body" > /tmp/recruit.html
              exit 0
            fi
            sleep 4
          done
          echo 'Production route did not expose the BKLG-0219 landing page in time.'
          exit 1
      - name: Verify deployed conversion surface
        shell: bash
        run: |
          grep -q 'data-acquisition-source="PAID_RECRUITMENT"' /tmp/recruit.html
          grep -q 'meta-pixel.js' /tmp/recruit.html
          if grep -q '<nav' /tmp/recruit.html; then
            echo 'Global navigation unexpectedly present.'
            exit 1
          fi
      - name: Measure production response time
        shell: bash
        run: |
          for sample in 1 2 3; do
            curl --fail --silent --show-error --output /dev/null --max-time 20 --write-out '%{time_total}\n' https://mydriveventure.com/join/recruit/
          done | tee /tmp/recruit-times.txt
          python3 - <<'PY'
          from pathlib import Path
          values=sorted(float(v) for v in Path('/tmp/recruit-times.txt').read_text().split())
          median=values[len(values)//2]
          print(f'BKLG-0219 production response samples: {values}')
          print(f'BKLG-0219 production median response time: {median:.3f}s')
          PY
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Measure production browser page load
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          const browser = await chromium.launch({ headless: true });
          const samples = [];
          try {
            for (let i = 0; i < 3; i += 1) {
              const context = await browser.newContext();
              const page = await context.newPage();
              await page.goto('https://mydriveventure.com/join/recruit/', { waitUntil: 'load', timeout: 20000 });
              const nav = await page.evaluate(() => {
                const entry = performance.getEntriesByType('navigation')[0];
                return entry ? entry.loadEventEnd - entry.startTime : null;
              });
              if (!(typeof nav === 'number' && Number.isFinite(nav) && nav > 0)) {
                throw new Error('Navigation Timing did not return a valid load duration');
              }
              samples.push(nav);
              await context.close();
            }
          } finally {
            await browser.close();
          }
          samples.sort((a,b)=>a-b);
          const median = samples[Math.floor(samples.length/2)];
          console.log('BKLG-0219 production browser load samples (ms):', samples.map(v=>Math.round(v)));
          console.log('BKLG-0219 production browser median load:', Math.round(median), 'ms');
          if (median > 2500) {
            throw new Error(`Production browser median ${Math.round(median)}ms exceeds the 2500ms recommendation`);
          }
          NODE
