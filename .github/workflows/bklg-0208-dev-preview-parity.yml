name: BKLG-0208 DEV Family Purchase Verification
on:
  pull_request:
    branches: [main]
    paths:
      - family/**
      - assets/js/commercial-purchase.js
      - assets/js/family.js
      - assets/js/family-bootstrap.js
      - assets/css/commercial-purchase.css
      - operator/payments/**
      - _redirects
      - tests/bklg-0208-checkout.test.js
      - tests/e2e/bklg-0208-family-purchase.spec.mjs
      - .github/workflows/bklg-0208-dev-preview-parity.yml
permissions:
  contents: read
jobs:
  purchase-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify shared purchase contract and removed checkout
        run: |
          node --check assets/js/commercial-purchase.js
          node --test tests/bklg-0208-checkout.test.js
      - name: Verify no standalone checkout reference in public Family Hub
        run: |
          if test -e checkout/index.html; then echo "Standalone checkout must not ship"; exit 1; fi
          if grep -R -nE 'href="/checkout/|src="/assets/js/checkout.js' family/; then exit 1; fi

  mocked-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Isolated Family Hub purchase browser regressions
        run: npx playwright test tests/e2e/bklg-0208-family-purchase.spec.mjs --retries=0

  deployed-dev-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify DEV preview serves this purchase implementation
        env:
          DEV_URL: https://bklg-0208-web-checkout-ui.mydriveventure-dev.pages.dev
        run: |
          set -eu
          for attempt in $(seq 1 30); do
            matched=true
            for path in assets/js/commercial-purchase.js assets/css/commercial-purchase.css assets/js/family.js assets/js/family-bootstrap.js family/index.html operator/payments/index.html operator/payments/diagnostics.js; do
              if ! curl -fsS "$DEV_URL/${path%index.html}?parity=${{ github.event.pull_request.head.sha }}-$attempt" -o /tmp/live-source || ! cmp -s "$path" /tmp/live-source; then matched=false; break; fi
            done
            if $matched; then break; fi
            sleep 10
          done
          $matched || { echo 'DEV source parity failed'; exit 1; }
          for path in checkout checkout/ checkout/index.html; do
            curl -fsS -D /tmp/retired-headers "$DEV_URL/$path?dev_test_run=obsolete&test_family=obsolete" -o /tmp/retired-body
            grep -qi '^location: /family/' /tmp/retired-headers
          done
          echo 'DEV asset parity and checkout retirement verified; no payment requests made.'
